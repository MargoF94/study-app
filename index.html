<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#34495a" />
    <meta name="description" content="Study for exams and qualifications: questions, notes, highlights and handwriting." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Study Log" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Study Log</title>
    <script>
      // Paint the reading colours, font and size chosen on this device before the app loads.
      try {
        var paint = JSON.parse(localStorage.getItem('study-log:paint') || 'null');
        if (paint) {
          if (paint.theme) document.documentElement.dataset.theme = paint.theme;
          for (var k in paint.vars) document.documentElement.style.setProperty(k, paint.vars[k]);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
